# Refresh the league standings from nuLiga after every match day.
# All matches are on Saturdays and nuLiga has the results the next day,
# so this runs Sunday and Monday morning (retry in case nuLiga is late).
# A commit is only created when the numbers actually changed; the push
# triggers the normal GitHub Pages deployment.
name: Update standings

on:
  schedule:
    - cron: "0 7 * * 0,1" # Sun+Mon 07:00 UTC = 08:00/09:00 Berlin
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and rewrite standings.js
        run: node scripts/update-standings.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet standings.js; then
            echo "standings unchanged — nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "standings-bot"
          git config user.email "actions@github.com"
          git add standings.js
          git commit -m "chore(standings): update from nuLiga"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # a push made with GITHUB_TOKEN does not trigger the deploy-hosting
      # workflow, so the Firebase mirror is deployed from here as well
      - name: Deploy Firebase Hosting mirror
        if: steps.commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BADMINTON_TOOLS_C6B27 }}
          projectId: badminton-tools-c6b27
          target: team4
          channelId: live
