# Refresh the league standings from nuLiga after every match day.
# All matches are on Saturdays and nuLiga has the results the next day,
# so this runs Sunday and Monday morning (retry in case nuLiga is late).
# A commit is only created when the numbers actually changed; the push
# triggers the normal GitHub Pages deployment.
name: Update standings

on:
  schedule:
    - cron: "0 7 * * 0,1" # Sun+Mon 07:00 UTC = 08:00/09:00 Berlin
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and rewrite standings.js
        run: node scripts/update-standings.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet standings.js; then
            echo "standings unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "standings-bot"
          git config user.email "actions@github.com"
          git add standings.js
          git commit -m "chore(standings): update from nuLiga"
          git push
